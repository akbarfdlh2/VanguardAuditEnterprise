[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vanguard-audit"
version = "2.0.0"
description = "Enterprise Defensive Web, SSL/TLS & DNS Security Posture Inspector (TUI & CI/CD CLI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Defensive Security Engineering Team", email = "security@example.com" }
]
keywords = ["security", "audit", "defensive", "tui", "spf", "dmarc", "dnssec", "owasp", "textual"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "textual>=0.58.0",
    "rich>=13.7.1",
    "httpx>=0.27.0",
    "dnspython>=2.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit[toml]>=1.7.8",
    "pre-commit>=3.7.0",
]

[project.scripts]
vanguard = "vanguard.main:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vanguard = ["ui/*.tcss"]

# =====================================================================
# RUFF CONFIGURATION (Linter, Import Sorter & Code Formatter)
# =====================================================================
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear (common bugs & design problems)
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade (modern python syntax)
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "PTH",    # flake8-use-pathlib
    "S",      # flake8-bandit (security checks)
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # Line length diatur oleh formatter
    "S101",   # Mengizinkan penggunaan assert di dalam folder tests
    "S105",   # Severity.PASS = "PASS" false-positive hardcoded password
    "S110",   # Try-except-pass pada DNS query
    "S112",   # Try-except-continue pada DNS loop
    "RUF001", # Karakter Unicode/Emoji pada teks laporan dan UI
    "RUF002", # Karakter Unicode/Emoji pada docstrings
    "RUF003", # Karakter Unicode/Emoji pada komentar
    "RUF012", # ClassVar warning pada konfigurasi Textual BINDINGS
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["vanguard"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# =====================================================================
# MYPY CONFIGURATION (Strict Static Type Checking)
# =====================================================================
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
ignore_missing_imports = true
mypy_path = "src"

# =====================================================================
# PYTEST & COVERAGE CONFIGURATION
# =====================================================================
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers --cov=vanguard --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["vanguard"]
omit = [
    "*/vanguard/main.py",
    "*/vanguard/__init__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# =====================================================================
# BANDIT CONFIGURATION (Static Security Analysis for Python Code)
# =====================================================================
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B105", "B110", "B112"]
